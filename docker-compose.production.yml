services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env.production}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_DRIVER: postgres
      DB_DSN: ${DB_DSN:?set DB_DSN in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env.production}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env.production}
      ADMIN_SETTINGS_ENCRYPTION_KEY: ${ADMIN_SETTINGS_ENCRYPTION_KEY:?set ADMIN_SETTINGS_ENCRYPTION_KEY in .env.production}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      PUBLIC_UPLOAD_BASE_URL: ${PUBLIC_UPLOAD_BASE_URL:?set PUBLIC_UPLOAD_BASE_URL in .env.production}
      PUBLIC_LANDING_URL: ${PUBLIC_LANDING_URL:?set PUBLIC_LANDING_URL in .env.production}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:?set MIDTRANS_SERVER_KEY in .env.production}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?set MIDTRANS_CLIENT_KEY in .env.production}
      MIDTRANS_NOTIFICATION_TOKEN: ${MIDTRANS_NOTIFICATION_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-kebaikanku.id}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-}
      WAITLIST_ADMIN_EMAIL: ${WAITLIST_ADMIN_EMAIL:-}
      WAITLIST_EMAIL_URL: ${WAITLIST_EMAIL_URL:-https://kebaikanku.id}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bootstrap:
    build:
      context: ./backend
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap"]
    environment:
      APP_ENV: production
      DB_DRIVER: postgres
      DB_DSN: ${DB_DSN:?set DB_DSN in .env.production}
      PILOT_ORGANIZATION_ID: ${PILOT_ORGANIZATION_ID:-pilot-org}
      PILOT_ORGANIZATION_NAME: ${PILOT_ORGANIZATION_NAME:?set PILOT_ORGANIZATION_NAME in .env.production}
      PILOT_ORGANIZATION_EMAIL: ${PILOT_ORGANIZATION_EMAIL:?set PILOT_ORGANIZATION_EMAIL in .env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data:
