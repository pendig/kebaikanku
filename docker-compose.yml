services:
  postgres:
    image: postgres:16-alpine
    container_name: kebaikanku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kebaikanku
      POSTGRES_USER: kebaikanku
      POSTGRES_PASSWORD: kebaikanku
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kebaikanku -d kebaikanku"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
